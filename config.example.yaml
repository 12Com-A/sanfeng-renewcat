# =====================================================================
# 续命喵 - 配置示例
# install.sh 会把它复制成 config.yaml（已有 config.yaml 时不会覆盖）
# 也可以手动：cp config.example.yaml config.yaml 然后改下面的值
# =====================================================================


# =====================================================================
# 三丰云账号
# =====================================================================
sanfengyun:
  phone: "你的三丰云手机号"
  password: "你的三丰云密码"


# =====================================================================
# 知乎账号（用于发布评测文章）
# =====================================================================
zhihu:
  login_url: "https://www.zhihu.com/signin"
  email: "你的知乎登录手机号/邮箱"
  password: "你的知乎密码"
  username: ""                 # 可留空（登录后自动识别主页 token）
  cookies_file: ""             # 可留空，默认 zhihu_cookies.json


# =====================================================================
# 钉钉机器人通知（不想用就把 enabled 改成 false）
# =====================================================================
dingtalk:
  enabled: true
  webhook: "https://oapi.dingtalk.com/robot/send?access_token=xxx"
  secret: "SECxxx"
  at_all: false
  at_mobiles: []


# =====================================================================
# 延期产品列表（免费云服务器 / 免费虚拟主机）
# =====================================================================
products:
  - key: "vps"
    name: "免费云服务器"
    ptype: "vps"
    enabled: true
    url: "https://www.sanfengyun.com/control/#/freeServer/你的实例ID"

  - key: "vhost"
    name: "免费虚拟主机"
    ptype: "vhost"
    enabled: false
    url: "https://www.sanfengyun.com/control/#/freeVhost/你的实例ID"


# =====================================================================
# 运行参数
# =====================================================================
settings:
  # 遗留字段，代码未使用，保留兼容
  check_interval: 600
  early_submit_seconds: 60
  # true = 只填三丰云表单不提交（首次部署建议先 true，跑通再改 false）
  dry_run: true
  # 留空 = 不替换任何词（三丰云要求文章里必须出现「三丰云」）
  sanitize_keywords: []
  # 知乎登录过期时，二维码图片通过这个地址让钉钉抓取（填服务器公网 IP）
  qr_public_base: "http://你的服务器公网IP"
  qr_port: 80
  # 扫描范围：all / vps / vhost
  scan_scope: "vps"


# =====================================================================
# 日志配置
# =====================================================================
logging:
  level: "INFO"
  file: "/root/run.log"
  console: true

# =============================================================================
# PORTING HINTS
# =============================================================================

porting_hint:
  scenario_adapt_other_auto_renew_bot:
    description: "adapt this project to another web-auto-renew/auto-sign bot"
    steps:
      - "reuse infra: load_instance_state, save_instance_state, setup_logging, _human_countdown"
      - "reuse loop skeleton: run_loop slice-sleep + per-instance countdown"
      - "reuse notification: DingTalkNotifier (or adapt _send to other IM webhook)"
      - "reuse stealth page: new_page"
      - "REWRITE: DOM scanner (scan_product) for target platform"
      - "REWRITE: form submit (fill_and_submit) for target platform"
      - "REWRITE: article/content generator if needed"
      - "REWRITE: state machine business branches in _execute_single_product"

  scenario_extract_generic_automation_utils:
    description: "extract reusable utilities to a common lib"
    extract:
      - "_compress_screenshot (image compression)"
      - "_sign + _get_url + send_text + send_markdown + _send (dingtalk notification)"
      - "_handle_checkbox (captcha bypass)"
      - "_fix_cookie_domain (cross-subdomain cookie)"
      - "_click_renew_tab (fuzzy text click)"
      - _fill_url (multi-selector fallback)
      - load_instance_state + save_instance_state (json persistence)

# =============================================================================
# LLM MODIFY GUIDANCE
# =============================================================================

llm_modify_guidance:
  - "When adding feature: preserve existing state-machine transitions; add new sub-branch instead of rewriting main flow."
  - "When fixing bug: cross-check against hard_constraint_list and state_machine."
  - "When extracting components: refer reusable_template_extract_map."
  - "After code change: update AI_SPEC.yaml accordingly (function_catalog, state_machine, hard_constraint_list, risk_items, technical_debt)."
  - "Output diff-style changes; full rewrite only when explicitly requested."
  - "If introducing new external dependency: add to meta.major_deps."
  - "If changing cooldown values: update both global_constants.cooldown_seconds AND state_machine transition_table AND _execute_single_product code."
